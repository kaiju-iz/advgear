name: Build AdvancedGear

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin jar
        run: mvn -B -ntp package

      - name: Zip resource pack
        run: |
          cd resource-pack
          zip -r ../advancedgear-pack.zip pack.mcmeta assets
          cd ..
          SHA=$(sha1sum advancedgear-pack.zip | cut -d' ' -f1)
          echo "Resource pack SHA-1: $SHA"
          echo "### Resource pack SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the 'latest' tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish release (jar + resource pack)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: |
            target/AdvancedGear-*.jar
            advancedgear-pack.zip
